# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = ["ALL"]

ignore = [
    "D203",    # incompatible with D211, which stays enabled
    "D213",    # incompatible with D212, which stays enabled
    "COM812",  # missing-trailing-comma (conflicts with formatter)
]

[lint.per-file-ignores]
# Tests can use assert, magic values, don't need full docstrings or type annotations,
# may access private members for state inspection, have long names, and declare
# pytest fixtures that are used implicitly (not referenced in the body).
"tests/**/*.py" = ["S101", "PLR2004", "D", "ANN", "ARG", "SLF001", "E501"]
# Standalone helper scripts are not part of an importable package.
"scripts/*.py" = ["INP001"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
